name: CI

on:
  push:
  pull_request:

jobs:
  # Python 3.13 runs the same full suite in recorders-with-latex below.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --requirement requirements-ci.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -q
      - run: python -m compileall -q .agents/skills/cumcm-workflow/scripts tests
      - name: Validate JSON Schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for path in Path('.agents/skills/cumcm-workflow/schemas').glob('*.json'):
              Draft202012Validator.check_schema(json.loads(path.read_text(encoding='utf-8')))
          PY

  recorders-with-latex:
    # The compile tests skip themselves when no engine is present; this job installs
    # one so that record_compile.py is exercised against a real xelatex run, and the
    # ctex case stops being skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --requirement requirements-ci.txt
      - name: Install XeLaTeX and the ctex class
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-xetex texlive-lang-chinese texlive-latex-recommended \
            texlive-fonts-recommended texlive-pictures poppler-utils
      # Run the whole suite: the recorder tests are the ones that need an engine,
      # but a name pattern silently matches nothing after a rename, so don't use one.
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
